[package]
name = "spo-api"
version = "0.1.0"
edition = "2021"
description = "Secure Payment Orchestrator - Payment orchestration API backend"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP framework
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# Cache
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Logging & observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-opentelemetry = "0.28"
metrics = "0.23"
metrics-exporter-prometheus = "0.16"

# Security
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
argon2 = "0.5"
subtle = "2.6"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Config
config = "0.14"
dotenvy = "0.15"

# Error handling
thiserror = "2"
anyhow = "1"

# Async
async-trait = "0.1"

# HTTP client for provider adapters
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.13"
rstest = "0.23"
testcontainers = "0.21"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true